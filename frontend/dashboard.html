<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — LuaHub</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css?v=13"/>
  <script src="/assets/app.js?v=13" defer></script>
  <style>
    .key-box { background: rgba(124,58,237,0.1); border: 1px solid #7c3aed; border-radius: 12px; padding: 2rem; text-align: center; margin-bottom: 2rem; }
    .key-box a { display: inline-block; background: #7c3aed; color: white; padding: 1rem 2rem; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 1rem; }
    .key-warning { color: #f59e0b; font-size: 0.85rem; margin-top: 1rem; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo"><svg width="24" height="24" fill="currentColor" class="logo-icon" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.8l6.9 13.8H5.1L12 5.8z"/></svg> LuaHub</a>
    <div class="nav-links">
      <a href="/">Hub</a>
      <span id="user-name" style="color: white; font-weight: 600;">User</span>
      <button onclick="localStorage.clear(); window.location.href='/'" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:600;">Logout</button>
    </div>
  </nav>

  <section style="padding-top: 4rem; max-width: 1200px; margin: 0 auto; padding-left: 2rem; padding-right: 2rem;">
    <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; font-weight: 800;">Dashboard</h1>
    
    <!-- MASTER KEY SYSTEM -->
    <div class="key-box">
      <h2 style="margin-bottom: 0.5rem;">🔑 Get Your Master Key</h2>
      <p style="color: var(--muted); margin-bottom: 1.5rem;">You need a key to run ANY script on LuaHub. Generate one key and use it for everything.</p>
      <!-- REPLACED URL HERE -->
      <a href="https://boostylink.com/H9kYR2AQ" target="_blank">Generate Key Now</a>
      <div class="key-warning">
        <span>⚠️</span>
        <span>Keys are <strong>single-use</strong> to prevent bot bypass. One key = one script execution.</span>
      </div>
    </div>

    <div class="dashboard-grid">
      <div class="panel">
        <h2 style="margin-bottom: 1.5rem;">📤 Deploy New Script</h2>
        <input id="s-name" placeholder="Script Name (e.g., Universal ESP)" />
        <textarea id="s-code" placeholder="Paste your encrypted .bin contents here..."></textarea>
        
        <div style="display:flex; align-items:center; gap:10px; margin-bottom: 1.5rem;">
          <input type="checkbox" id="t-key" style="width:20px; height:20px; cursor:pointer;">
          <label for="t-key" style="color:var(--muted); cursor:pointer;">Require Key System</label>
        </div>

        <button class="action" id="upload-btn" onclick="uploadScript()">Deploy Script</button>
        <div id="upload-result" class="result-box hidden"></div>
      </div>

      <div class="panel">
        <h2 style="margin-bottom: 1.5rem;">📦 Your Scripts</h2>
        <div id="my-scripts"><p style="color: var(--muted);">Loading...</p></div>
      </div>
    </div>
  </section>

  <script>
    document.getElementById('user-name').textContent = localStorage.getItem('username') || 'User';
    
    async function apiFetch(path, method = 'GET', body = null) {
      const opts = {
        method,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
      }
      if (body) opts.body = JSON.stringify(body)
      const res = await fetch(path, opts)
      return res.json()
    }

    async function uploadScript() {
      const btn = document.getElementById('upload-btn')
      const name = document.getElementById('s-name').value.trim()
      const content = document.getElementById('s-code').value.trim()
      const requiresKey = document.getElementById('t-key').checked
      
      if (!name || !content) return alert('Name and payload required')

      btn.disabled = true; btn.textContent = 'Deploying...'
      try {
        const res = await apiFetch('/api/scripts', 'POST', { name, content, is_public: true, requires_key: requiresKey })
        const box = document.getElementById('upload-result')
        box.classList.remove('hidden')
        
        if (res && res.slug) {
          const url = `${window.location.origin}/api/loader/${res.slug}`
          let loaderStr = `loadstring(game:HttpGet("${url}"))()`
          if (requiresKey) {
             loaderStr = `script_key = "YOUR_KEY_HERE";\nloadstring(game:HttpGet("${url}"))()`
          }
          
          box.innerHTML = `<p>✅ Deployed!</p><code style="display:block; margin-top:0.5rem; color:#10b981">${loaderStr}</code>`
          document.getElementById('s-name').value = ''
          document.getElementById('s-code').value = ''
          document.getElementById('t-key').checked = false
          loadScripts()
        } else {
          box.innerHTML = `<p style="color:#ef4444">Error: ${res?.error}</p>`
        }
      } catch (e) { alert(e.message) }
      btn.disabled = false; btn.textContent = 'Deploy Script'
    }

    async function loadScripts() {
      const box = document.getElementById('my-scripts')
      try {
        const scripts = await apiFetch('/api/scripts', 'GET')
        if (!Array.isArray(scripts) || !scripts.length) {
          box.innerHTML = '<p style="color: var(--muted)">No scripts deployed yet.</p>'
          return
        }
        box.innerHTML = scripts.map(s => `
          <div style="padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 1rem; border: 1px solid var(--glass-border);">
            <strong style="font-size:1.1rem; display:block; margin-bottom:0.5rem;">${s.name}</strong> 
            ${s.requires_key ? '<span style="color:#ef4444; font-size:0.8rem;">Key Required</span>' : '<span style="color:#10b981; font-size:0.8rem;">Free Access</span>'}
            <code style="display:block; margin-top:0.5rem; font-size:0.75rem; color:#a78bfa;">Slug: ${s.slug}</code>
          </div>
        `).join('')
      } catch (e) {
        box.innerHTML = `<p style="color: #ef4444">Error loading scripts.</p>`
      }
    }

    if (localStorage.getItem('token')) {
      loadScripts();
    }
  </script>
</body>
</html>
