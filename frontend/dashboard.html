<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard — LuaHub</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=17"/>
<script src="/assets/app.js?v=17" defer></script>
<style>
  .role-chip{display:inline-block;padding:2px 10px;border-radius:6px;font-size:0.75rem;font-weight:700;margin-left:0.5rem; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);}
  .role-dev{background:var(--accent); color:#fff; border:none;}
  .verified-chip{background:var(--success); color:#052e1a; border:none;}
  .key-box{background:rgba(124,58,237,0.05);border:1px solid rgba(124,58,237,0.3);border-radius:var(--radius);padding:2rem;text-align:center;margin-bottom:2rem; backdrop-filter: blur(10px);}
  .locked{position:relative; padding: 0.5rem; border: 1px dashed var(--glass-border); border-radius: 8px;}
  .locked-note{color:#f59e0b;font-weight:600;font-size:0.85rem;}
  .dashboard-grid { display:grid; grid-template-columns:1fr 1fr; gap:2rem; }
  @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">
    <svg width="24" height="24" fill="currentColor" class="logo-icon" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.8l6.9 13.8H5.1L12 5.8z"/></svg>
    LuaHub
  </a>
  <div class="nav-links">
    <a href="/">Hub</a>
    <span id="user-name" style="color:#fff;">User</span>
    <span id="user-chips"></span>
    <button onclick="localStorage.clear();location.href='/'" style="background:none;border:none;color:#ef4444;cursor:pointer;font-weight:600; font-family:inherit; font-size: 0.95rem;">Logout</button>
  </div>
</nav>

<section class="container" style="padding-top: 4rem;">
  <h1 style="font-size: 2.5rem; margin-bottom: 2rem; font-weight: 800;">Dashboard</h1>

  <div class="key-box">
    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">🔑 Master Key</h2>
    <p style="color:var(--muted); margin-bottom: 1.5rem;">Generate a key for script execution. Single-use per script to prevent bypasses.</p>
    <a href="https://boostylink.com/H9kYR2AQ" target="_blank" rel="noopener" class="btn-primary" style="padding: 0.8rem 2rem; font-size: 0.95rem;">Generate Key Now</a>
    <div style="color:#f59e0b;font-size:0.85rem;margin-top:1.2rem;">⚠️ Keys are single-use. One key = one script run.</div>
  </div>

  <div class="dashboard-grid">
    <div class="panel">
      <h2 style="margin-bottom:1.5rem; font-size: 1.25rem;">📤 Deploy Script</h2>

      <input id="s-name" placeholder="Script Name (e.g. Universal ESP)"/>

      <label style="display:block;margin-bottom:0.5rem;color:var(--muted);font-size:0.85rem; font-weight: 500;">Obfuscation Method</label>
      <select id="obf-method">
        <option value="loader">Loader (Standard)</option>
        <option value="bootstrapper">Bootstrapper (Advanced)</option>
        <option value="bytecode">Bytecode (Raw)</option>
      </select>

      <textarea id="s-code" placeholder="Paste encrypted .bin contents here..." style="height:180px;"></textarea>

      <div id="key-toggle-wrap" style="display:flex;align-items:center;gap:10px;margin:1.5rem 0;">
        <input type="checkbox" id="t-key" style="width:18px;height:18px; margin:0; cursor:pointer; accent-color: var(--accent);"/>
        <label for="t-key" style="color:var(--muted);cursor:pointer; font-size: 0.95rem;">Require Key System</label>
        <div class="locked-note" id="key-lock" style="display:none; margin-left: auto;">🔒 Developer role required</div>
      </div>

      <button class="btn-primary btn-full" id="upload-btn" onclick="uploadScript()">Deploy Script</button>
      <div id="upload-result" style="margin-top:1rem;"></div>
    </div>

    <div class="panel">
      <h2 style="margin-bottom:1.5rem; font-size: 1.25rem;">📦 Your Scripts</h2>
      <div id="my-scripts"><p style="color:var(--muted);">Loading...</p></div>
    </div>
  </div>

  <div class="panel" id="profile-panel" style="margin-top:2rem; display:none;">
    <h2 style="margin-bottom:1.5rem; font-size: 1.25rem;">👤 Profile</h2>
    <input id="p-bio" placeholder="Bio"/>
    <input id="p-avatar" placeholder="Avatar URL"/>
    <button class="btn-primary" onclick="saveProfile()">Save Profile</button>
  </div>
</section>

<script>
  const ROLE = localStorage.getItem('role') || 'user';
  const VERIFIED = localStorage.getItem('verified') === 'true';
  document.getElementById('user-name').textContent = localStorage.getItem('username') || 'User';
  document.getElementById('user-chips').innerHTML =
    `<span class="role-chip ${ROLE === 'developer' ? 'role-dev' : ''}">${ROLE}</span>` +
    (VERIFIED ? `<span class="role-chip verified-chip">verified</span>` : '');

  if (ROLE !== 'developer') {
    document.getElementById('key-lock').style.display = 'block';
    document.getElementById('t-key').disabled = true;
  }
  if (VERIFIED) document.getElementById('profile-panel').style.display = 'block';

  async function apiFetch(path, method='GET', body=null) {
    const opts = {
      method,
      headers: {'Content-Type':'application/json', Authorization: 'Bearer ' + localStorage.getItem('token')}
    };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(path, opts);
    return r.json();
  }

  async function uploadScript() {
    const btn = document.getElementById('upload-btn');
    const name = document.getElementById('s-name').value.trim();
    const content = document.getElementById('s-code').value.trim();
    const obf_method = document.getElementById('obf-method').value;
    const requires_key = ROLE === 'developer' && document.getElementById('t-key').checked;

    if (!name || !content) return alert('Name + payload required');
    btn.disabled = true; btn.textContent = 'Deploying...';

    const res = await apiFetch('/api/scripts', 'POST', { name, content, is_public: true, requires_key, obf_method });
    const box = document.getElementById('upload-result');

    if (res && res.slug) {
      const url = `${location.origin}/api/loader/${res.slug}`;
      let one = `loadstring(game:HttpGet("${url}"))()`;
      if (requires_key) one = `script_key = "YOUR_KEY"\n` + one;
      box.innerHTML = `<p style="color:var(--success);font-weight:600;">✅ Deployed Successfully</p>
        <code style="display:block;margin-top:0.8rem;color:var(--success);white-space:pre-wrap;font-size:0.8rem;background:#000;padding:1rem;border-radius:8px;border:1px solid rgba(16,185,129,0.2);">${one}</code>`;
      ['s-name','s-code'].forEach(id => document.getElementById(id).value='');
      document.getElementById('t-key').checked = false;
      loadScripts();
    } else {
      box.innerHTML = `<p style="color:#ef4444;">Error: ${res?.error || 'unknown'}</p>`;
    }
    btn.disabled = false; btn.textContent = 'Deploy Script';
  }

  async function loadScripts() {
    const box = document.getElementById('my-scripts');
    const scripts = await apiFetch('/api/scripts', 'GET');
    if (!Array.isArray(scripts) || !scripts.length) {
      box.innerHTML = '<p style="color:var(--muted);">No scripts deployed yet.</p>';
      return;
    }
    box.innerHTML = scripts.map(s => `
      <div style="padding:1.2rem;background:var(--surface);border-radius:12px;margin-bottom:1rem;border:1px solid var(--glass-border); transition: all 0.3s;">
        <strong style="display:block;font-size:1.05rem;color:#fff;">${s.name}</strong>
        <div style="font-size:0.8rem;color:var(--accent-soft);margin: 0.4rem 0; font-weight: 600;">${s.obf_method.toUpperCase()}</div>
        <div style="font-size:0.8rem;color:var(--muted);margin-top:0.3rem;">
          ${s.requires_key ? '<span style="color:#ef4444;font-weight:600;">Key Required</span>' : '<span style="color:var(--success);font-weight:600;">Free Access</span>'}
          · ${s.hits || 0} runs
        </div>
        <code style="display:block;margin-top:0.6rem;font-size:0.75rem;color:var(--muted); font-family: var(--mono);">${s.slug}</code>
      </div>`).join('');
  }

  async function saveProfile() {
    const bio = document.getElementById('p-bio').value;
    const avatar_url = document.getElementById('p-avatar').value;
    const r = await apiFetch('/api/profile', 'PATCH', { bio, avatar_url });
    alert(r.ok ? 'Saved' : ('Error: ' + r.error));
  }

  if (localStorage.getItem('token')) {
    loadScripts();
    if (VERIFIED) {
      apiFetch('/api/profile').then(r => {
        if (r.profile) {
          document.getElementById('p-bio').value = r.profile.bio || '';
          document.getElementById('p-avatar').value = r.profile.avatar_url || '';
        }
      });
    }
  }
</script>
</body>
</html>
