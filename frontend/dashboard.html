<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Studio — LuaHub</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=31"/>
<style>
  .admin-layout { display: flex; gap: 2rem; max-width: 1400px; margin: 2rem auto; padding: 0 2rem; }
  .sidebar { width: 300px; flex-shrink: 0; }
  .main-panel { flex-grow: 1; }
  
  .panel { background: var(--surface); border: 1px solid var(--glass-border); border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; }
  .panel h2 { font-size: 1.25rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 0.5rem; }
  
  .form-group { margin-bottom: 1.5rem; }
  .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600; color: #fff; }
  .form-group p { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.8rem; }
  
  .url-box { display: flex; gap: 0.5rem; margin-top: 1rem; }
  .url-box input { flex-grow: 1; background: #000; color: var(--accent-soft); font-family: var(--mono); border: 1px solid var(--glass-border); padding: 0.8rem; border-radius: 8px; }
  .url-box button { background: var(--accent); color: #fff; border: none; padding: 0 1.5rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
  
  .script-item { padding: 1rem; background: rgba(0,0,0,0.3); border-radius: 8px; margin-bottom: 0.8rem; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
  .script-item:hover { border-color: var(--accent); background: rgba(124,58,237,0.1); }
  .script-item.active { border-color: var(--accent); background: rgba(124,58,237,0.15); }
  .script-title { font-weight: 600; color: #fff; display: block; margin-bottom: 0.2rem; }
  .script-meta { font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">
    <img src="/favicon.svg" width="24" height="24" style="border-radius:6px; margin-right:6px;"/> LuaHub Admin
  </a>
  <div class="nav-links">
    <a href="/">Back to Site</a>
    <span id="user-name" style="color:#fff; font-weight:600;"></span>
    <button onclick="logout()" style="background:none;border:none;color:#ef4444;cursor:pointer;font-weight:600;">Logout</button>
  </div>
</nav>

<div class="admin-layout">
  <div class="sidebar">
    <div class="panel">
      <h2>Your Scripts</h2>
      <button class="btn-primary" style="width:100%; margin-bottom: 1.5rem;" onclick="resetForm()">+ New Script</button>
      <div id="script-list">
        <p style="color:var(--muted); font-size:0.9rem;">Loading...</p>
      </div>
    </div>
  </div>

  <div class="main-panel">
    <div class="panel">
      <h2 id="form-title">Create New Script</h2>
      
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
        <div class="form-group">
          <label>Script Name</label>
          <input id="s-name" placeholder="e.g. Quantum Onyx" style="width:100%;"/>
        </div>
        <div class="form-group">
          <label>Runtime Duration (Seconds)</label>
          <input id="t-duration" type="number" value="600" style="width:100%;"/>
        </div>
      </div>

      <div class="form-group">
        <label>Raw Lua Source</label>
        <textarea id="s-code" placeholder="Paste your raw Lua script here..." style="width:100%; height:150px;"></textarea>
      </div>

      <div class="form-group">
        <label>BoostyLink Gateway URL</label>
        <p>Paste the URL generated from BoostyLink for this script.</p>
        <input id="t-boosty" placeholder="https://boostylink.com/..." style="width:100%;"/>
      </div>

      <div class="form-group">
        <label style="display:flex; align-items:center; gap:10px;">
          <input type="checkbox" id="t-key" style="width:20px; height:20px;"/>
          Enable Key System (Requires BoostyLink)
        </label>
      </div>

      <button class="btn-primary" id="save-btn" onclick="saveScript()" style="padding: 0.8rem 2rem;">Save & Generate Loader</button>
      <button class="btn-secondary" onclick="resetForm()" style="padding: 0.8rem 2rem; margin-left: 1rem;">Cancel</button>
    </div>

    <div id="url-panel" class="panel" style="display: none; border: 1px solid var(--accent);">
      <h2>Key System URLs</h2>
      <p style="color:var(--muted); font-size:0.9rem; margin-bottom: 1.5rem;">Configure these URLs in your BoostyLink dashboard and use the Share URL for your users.</p>
      
      <div class="form-group">
        <label>Return URL (Paste into BoostyLink's Destination URL)</label>
        <div class="url-box">
          <input id="out-return" readonly/>
          <button onclick="copyVal('out-return')">Copy</button>
        </div>
      </div>

      <div class="form-group">
        <label>Share URL (Paste into YouTube/Discord)</label>
        <div class="url-box">
          <input id="out-share" readonly/>
          <button onclick="copyVal('out-share')">Copy</button>
        </div>
      </div>

      <div class="form-group">
        <label>Generated Loadstring (Give this to users)</label>
        <textarea id="out-loader" readonly style="width:100%; height:120px; background:#000; color:var(--success); font-family:var(--mono); font-size:0.8rem; padding:0.5rem; border-radius:8px;" onclick="this.select()"></textarea>
      </div>
    </div>
  </div>
</div>

<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = '/';
  
  let payload = null;
  try {
    payload = JSON.parse(atob(token.split('.')[1]));
    document.getElementById('user-name').textContent = payload.name;
  } catch(e) { window.location.href = '/'; }

  if (!payload?.is_dev) {
    window.location.href = '/';
  }

  let allScripts = [];

  async function loadScripts() {
    const res = await fetch('/api/scripts');
    allScripts = await res.json();
    
    const list = document.getElementById('script-list');
    list.innerHTML = allScripts.map(s => `
      <div class="script-item" id="item-${s.slug}" onclick="loadScript('${s.slug}')">
        <span class="script-title">${s.name}</span>
        <div class="script-meta">
          ${s.requires_key ? '<span style="color:var(--accent-soft);">Key System</span>' : 'Free'} · ${s.hits || 0} runs
        </div>
      </div>
    `).join('');
  }

  function resetForm() {
    document.getElementById('form-title').textContent = 'Create New Script';
    document.getElementById('s-name').value = '';
    document.getElementById('s-code').value = '';
    document.getElementById('t-boosty').value = '';
    document.getElementById('t-duration').value = '600';
    document.getElementById('t-key').checked = false;
    document.getElementById('url-panel').style.display = 'none';
    document.getElementById('save-btn').textContent = 'Save & Generate Loader';
    
    document.querySelectorAll('.script-item').forEach(el => el.classList.remove('active'));
    document.getElementById('save-btn').onclick = () => saveScript();
  }

  function loadScript(slug) {
    const script = allScripts.find(s => s.slug === slug);
    if (!script) return;

    document.querySelectorAll('.script-item').forEach(el => el.classList.remove('active'));
    document.getElementById('item-' + slug).classList.add('active');

    document.getElementById('form-title').textContent = 'Edit Script: ' + script.name;
    document.getElementById('s-name').value = script.name;
    document.getElementById('s-code').value = ''; // Leave blank for security
    document.getElementById('s-code').placeholder = 'Leave blank to keep existing payload';
    document.getElementById('t-boosty').value = script.boosty_url || '';
    document.getElementById('t-duration').value = script.key_duration || 600;
    document.getElementById('t-key').checked = script.requires_key;
    
    if (script.return_url) {
      document.getElementById('url-panel').style.display = 'block';
      document.getElementById('out-return').value = script.return_url;
      document.getElementById('out-share').value = script.share_url;
    }

    document.getElementById('save-btn').textContent = 'Update Script';
    document.getElementById('save-btn').onclick = () => saveScript(slug);
  }

  async function saveScript(slugToUpdate = null) {
    const btn = document.getElementById('save-btn');
    const name = document.getElementById('s-name').value.trim();
    const content = document.getElementById('s-code').value.trim();
    const requires_key = document.getElementById('t-key').checked;
    const boosty_url = document.getElementById('t-boosty').value.trim();
    const key_duration = parseInt(document.getElementById('t-duration').value) || 600;

    if (!name) return alert('Name required');
    if (!slugToUpdate && !content) return alert('Content required for new scripts');
    if (requires_key && !boosty_url) return alert('BoostyLink URL required');

    btn.disabled = true; btn.textContent = 'Processing...';

    const bodyData = { name, requires_key, boosty_url, key_duration, obf_method: 'loader' };
    if (content) bodyData.content = content;

    const res = await fetch('/api/scripts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify(bodyData)
    });
    
    const data = await res.json();
    if (data.slug) {
      if (data.loader) {
        document.getElementById('url-panel').style.display = 'block';
        document.getElementById('out-loader').value = data.loader;
      }
      alert('Script saved successfully. Loader generated.');
      loadScripts();
    } else {
      alert('Error: ' + data.error);
    }
    
    btn.disabled = false; btn.textContent = 'Save & Generate Loader';
  }

  function copyVal(id) {
    const el = document.getElementById(id);
    el.select();
    navigator.clipboard.writeText(el.value);
    alert('Copied!');
  }

  function logout() {
    localStorage.clear();
    window.location.href = '/';
  }

  loadScripts();
</script>
</body>
</html>
