<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — LuaHub</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css?v=5"/>
</head>
<body>
  <nav>
    <a href="/" class="logo"><svg width="24" height="24" fill="currentColor" class="logo-icon" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.8l6.9 13.8H5.1L12 5.8z"/></svg> LuaHub</a>
    <div class="nav-links">
      <a href="/">Hub</a>
      <span style="color: var(--muted);">|</span>
      <span id="user-name" style="color: white; font-weight: 600;">User</span>
      <button onclick="localStorage.clear(); window.location.href='/'" style="background:none; border:none; color:#ef4444; cursor:pointer; font-weight:600;">Logout</button>
    </div>
  </nav>

  <section style="padding-top: 4rem;">
    <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; font-weight: 800;">Your Dashboard</h1>
    <p style="color: var(--muted); margin-bottom: 3rem;">Manage your obfuscated payloads and loader URLs.</p>

    <div class="dashboard-grid">
      <div class="panel">
        <h2 style="margin-bottom: 1.5rem;">📤 Upload Payload</h2>
        <input id="s-name" placeholder="Script Name (e.g., Universal ESP)" />
        <textarea id="s-code" placeholder="Paste your encrypted .bin contents here..."></textarea>
        
        <!-- KEY SYSTEM TOGGLE -->
        <div style="display:flex; align-items:center; gap:10px; margin-bottom: 1.5rem;">
          <input type="checkbox" id="s-key-toggle" style="width:20px; height:20px; cursor:pointer;">
          <label for="s-key-toggle" style="color:var(--muted); cursor:pointer;">Require Key System (BoostyLink)</label>
        </div>

        <button class="action" id="upload-btn" onclick="uploadScript()">Deploy Script</button>
        <div id="upload-result" class="result-box hidden"></div>
      </div>

      <div class="panel">
        <h2 style="margin-bottom: 1.5rem;">📦 Active Scripts</h2>
        <div id="my-scripts"><p style="color: var(--muted);">Loading...</p></div>
      </div>
    </div>
  </section>

  <script>
    document.getElementById('user-name').textContent = localStorage.getItem('username') || 'User';
    
    async function apiFetch(path, method = 'GET', body = null) {
      const opts = {
        method,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
      }
      if (body) opts.body = JSON.stringify(body)
      const res = await fetch(path, opts)
      return res.json()
    }

    async function uploadScript() {
      const btn = document.getElementById('upload-btn')
      const name = document.getElementById('s-name').value.trim()
      const content = document.getElementById('s-code').value.trim()
      const requiresKey = document.getElementById('s-key-toggle').checked
      
      if (!name || !content) return alert('Name and payload required')

      btn.disabled = true; btn.textContent = 'Deploying...'
      try {
        const res = await apiFetch('/api/scripts', 'POST', { name, content, is_public: true, requires_key: requiresKey })
        const box = document.getElementById('upload-result')
        box.classList.remove('hidden')
        if (res && res.slug) {
          const url = `${window.location.origin}/api/loader/${res.slug}`
          box.innerHTML = `<p>✅ Deployed! Loader URL:</p><code style="display:block;margin-top:0.5rem;color:#10b981">loadstring(game:HttpGet("${url}"))()</code>`
          document.getElementById('s-name').value = ''
          document.getElementById('s-code').value = ''
          document.getElementById('s-key-toggle').checked = false
          loadScripts()
        } else {
          box.innerHTML = `<p style="color:#ef4444">Error: ${res?.error}</p>`
        }
      } catch (e) { alert(e.message) }
      btn.disabled = false; btn.textContent = 'Deploy Script'
    }

    async function loadScripts() {
      const box = document.getElementById('my-scripts')
      try {
        const scripts = await apiFetch('/api/scripts', 'GET')
        if (!Array.isArray(scripts) || !scripts.length) {
          box.innerHTML = '<p style="color: var(--muted)">No scripts deployed yet.</p>'
          return
        }
        box.innerHTML = scripts.map(s => `
          <div class="script-card">
            <strong>${s.name}</strong> ${s.requires_key ? '<span style="color:#ef4444; font-size:0.8rem;">(Key Required)</span>' : ''}
            <span style="font-size:0.8rem;color:var(--muted);display:block;margin-top:0.5rem;">👁 ${s.hits || 0} hits</span>
            <code>loadstring(game:HttpGet("${window.location.origin}/api/loader/${s.slug}"))()</code>
          </div>
        `).join('')
      } catch (e) {
        box.innerHTML = `<p style="color: #ef4444">Error loading scripts.</p>`
      }
    }

    if (localStorage.getItem('token')) {
      loadScripts();
    }
  </script>
</body>
</html>
