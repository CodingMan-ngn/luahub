<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — LuaHub</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css?v=7"/>
  <script src="/assets/app.js?v=7" defer></script>
</head>
<body>
  <nav>
    <a href="/" class="logo"><svg width="24" height="24" fill="currentColor" class="logo-icon" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.8l6.9 13.8H5.1L12 5.8z"/></svg> LuaHub</a>
    <div class="nav-links">
      <a href="/">Hub</a>
      <div id="nav-profile" style="display:flex; align-items:center;"></div>
      <a href="/api/auth?action=logout" style="color:#ef4444; text-decoration:none; font-weight:600;">Logout</a>
    </div>
  </nav>

  <section style="padding-top: 4rem; max-width: 1200px; margin: 0 auto; padding-left: 2rem; padding-right: 2rem;">
    <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; font-weight: 800;">Dashboard</h1>
    <p style="color: var(--muted); margin-bottom: 3rem;" id="welcome-msg">Loading...</p>

    <!-- Developer Panel -->
    <div class="dashboard-grid" id="dev-panel" style="display:none;">
      <div class="panel">
        <h2 style="margin-bottom: 1.5rem;">📤 Deploy Script</h2>
        <input id="s-name" placeholder="Script Name" style="width:100%; padding:1rem; margin-bottom:1rem; background:#000; border:1px solid var(--glass-border); color:white; border-radius:8px;"/>
        <textarea id="s-source" placeholder="Public Source Code (Optional)" style="width:100%; padding:1rem; margin-bottom:1rem; background:#000; border:1px solid var(--glass-border); color:white; border-radius:8px; font-family:var(--mono); height:100px;"></textarea>
        <textarea id="s-code" placeholder="Encrypted .bin Payload" style="width:100%; padding:1rem; margin-bottom:1rem; background:#000; border:1px solid var(--glass-border); color:white; border-radius:8px; font-family:var(--mono); height:100px;"></textarea>
        
        <div style="display:flex; gap:1rem; margin-bottom:1rem;">
          <label><input type="checkbox" id="s-public-source"> Make Source Public</label>
          <label><input type="checkbox" id="s-key-toggle"> Require Key</label>
        </div>

        <button class="btn-primary" style="width:100%;" id="upload-btn" onclick="uploadScript()">Deploy Script</button>
        <div id="upload-result" class="hidden" style="margin-top:1rem;"></div>
      </div>

      <div class="panel">
        <h2 style="margin-bottom: 1.5rem;">📦 Manage Scripts</h2>
        <div id="my-scripts"><p style="color: var(--muted);">Loading...</p></div>
      </div>
    </div>

    <!-- Verified User Fallback -->
    <div id="user-panel" class="hidden" style="text-align:center; padding:4rem;">
      <h2 style="font-size:2rem; margin-bottom:1rem;">Welcome to LuaHub</h2>
      <p style="color:var(--muted); margin-bottom:2rem;">You are verified. Head back to the home page to browse and copy scripts.</p>
      <a href="/" class="btn-primary" style="text-decoration:none; padding:1rem 2rem;">Browse Scripts</a>
    </div>
  </section>

  <script>
    window.addEventListener('load', async () => {
      const session = await checkSession();
      if (!session.loggedIn) return window.location.href = '/';
      
      document.getElementById('nav-profile').innerHTML = `<img src="${session.avatar}" style="width:24px;height:24px;border-radius:50%;margin-right:8px;"> ${session.name}`;
      
      if (session.isDev) {
        document.getElementById('dev-panel').style.display = 'grid';
        document.getElementById('welcome-msg').textContent = "Developer Panel";
        loadDevScripts();
      } else {
        document.getElementById('user-panel').classList.remove('hidden');
        document.getElementById('welcome-msg').textContent = "User Dashboard";
      }
    });

    async function uploadScript() {
      const name = document.getElementById('s-name').value;
      const content = document.getElementById('s-code').value;
      const source = document.getElementById('s-source').value;
      const isPublicSource = document.getElementById('s-public-source').checked;
      const requiresKey = document.getElementById('s-key-toggle').checked;
      
      const btn = document.getElementById('upload-btn'); btn.textContent = 'Deploying...';
      
      const res = await fetch('/api/scripts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, content, source_code: source, is_public_source: isPublicSource, requires_key: requiresKey })
      });
      
      const data = await res.json();
      const box = document.getElementById('upload-result');
      box.classList.remove('hidden');
      box.innerHTML = data.slug ? `<p style="color:#10b981;">✅ Deployed Successfully!</p>` : `<p style="color:#ef4444;">Error: ${data.error}</p>`;
      
      btn.textContent = 'Deploy Script';
      loadDevScripts();
    }

    async function loadDevScripts() {
      const box = document.getElementById('my-scripts');
      const res = await fetch('/api/scripts');
      const scripts = await res.json();
      box.innerHTML = scripts.map(s => `
        <div style="padding:1rem; border-bottom:1px solid var(--glass-border); display:flex; justify-content:space-between;">
          <span>${s.name}</span>
          <span style="color:var(--muted); font-size:0.9rem;">👁 ${s.hits}</span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
