<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>New Paste — LuaHub</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=70"/>
<style>
  /* Aurora-style Layout */
  nav { 
    padding: 0 2rem; height: 60px; 
    background: #000; border-bottom: 1px solid var(--glass-border); 
    display: flex; justify-content: space-between; align-items: center;
  }
  .logo { font-size: 1.2rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; color: #fff; text-decoration: none; }
  
  .nav-links { display: flex; align-items: center; gap: 1.5rem; height: 100%; }
  .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: 0.2s; height: 100%; display: flex; align-items: center; padding: 0 0.5rem; }
  .nav-links a:hover { color: #fff; }
  
  .container { max-width: 800px; margin: 3rem auto; padding: 0 2rem; }
  .header-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1rem; }
  .header-row h1 { font-size: 2rem; font-weight: 700; margin: 0; }
  .header-row a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
  
  .editor-box { background: #0a0a0a; border: 1px solid var(--glass-border); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
  .editor-header { background: #111; padding: 0.5rem 1rem; display: flex; justify-content: flex-end; border-bottom: 1px solid var(--glass-border); }
  .editor-textarea { width: 100%; height: 400px; background: #000; color: #d4d4d4; border: none; padding: 1rem; font-family: var(--mono); font-size: 0.9rem; resize: vertical; outline: none; line-height: 1.5; }
  
  .editor-footer { display: flex; justify-content: space-between; padding: 0.75rem 1rem; background: #111; font-size: 0.8rem; color: var(--muted); border-top: 1px solid var(--glass-border); font-family: var(--mono); }
  
  .settings-box { margin-top: 1.5rem; background: #0a0a0a; border: 1px solid var(--glass-border); border-radius: 6px; padding: 1.5rem; }
  .settings-header { font-size: 0.85rem; font-weight: 600; color: #fff; margin-bottom: 1.5rem; letter-spacing: 0.5px; }
  
  .form-row { display: flex; align-items: center; margin-bottom: 1rem; }
  .form-row label { width: 120px; color: var(--muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-row input, .form-row select { flex: 1; background: #000; border: 1px solid var(--glass-border); color: #fff; padding: 0.7rem; border-radius: 4px; outline: none; font-family: var(--mono); font-size: 0.85rem; }
  .form-row input:focus, .form-row select:focus { border-color: var(--accent); }
  
  .btn-submit { width: 100%; padding: 1rem; background: #fff; color: #000; font-weight: 700; font-size: 1rem; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; margin-top: 1.5rem; }
  .btn-submit:hover { background: #ccc; }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Success Modal */
  .success-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 100; }
  .success-modal.active { display: flex; }
  .success-content { background: #0a0a0a; border: 1px solid var(--glass-border); border-radius: 8px; padding: 2rem; width: 100%; max-width: 500px; }
  .success-header { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 1.5rem; }
  .badge { background: #222; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.7rem; font-weight: 700; }
  .success-title { font-size: 1rem; font-weight: 500; }
  
  .link-box { display: flex; gap: 0.5rem; margin-top: 1rem; }
  .link-box input { flex: 1; background: #000; border: 1px solid var(--glass-border); color: #fff; padding: 0.7rem; border-radius: 4px; font-family: var(--mono); font-size: 0.85rem; }
  .btn-copy { background: #fff; color: #000; border: none; padding: 0.7rem 1rem; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
  
  .loadstring-box { margin-top: 1.5rem; background: #000; border: 1px solid var(--glass-border); border-radius: 4px; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
  .loadstring-box code { color: #a78bfa; font-size: 0.8rem; font-family: var(--mono); word-break: break-all; margin-right: 1rem; }
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">
    <img src="/favicon.svg" width="20" height="20" style="border-radius:4px;"/>
    LuaHub
  </a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="#">My Links</a>
    <a href="#">API Docs</a>
    <span id="user-name" style="color:#fff; font-weight:600; font-size:0.9rem;"></span>
    <button onclick="logout()" style="background:none; border:none; color:#ef4444; font-weight:600; cursor:pointer; font-size:0.9rem;">Logout</button>
  </div>
</nav>

<div class="container">
  <div class="header-row">
    <h1>New Paste</h1>
    <a href="#">My links</a>
  </div>
  
  <div class="editor-box">
    <div class="editor-header">
      <span style="font-size:0.75rem; color:var(--muted);">Editor</span>
    </div>
    <textarea id="s-code" class="editor-textarea" placeholder="Paste your script here..."></textarea>
    <div class="editor-footer">
      <span id="line-count">0 lines</span>
      <span id="char-count">0 KB</span>
    </div>
  </div>

  <div class="settings-box">
    <div class="settings-header">OPTIONAL PASTE SETTINGS</div>
    
    <div class="form-row">
      <label>Title</label>
      <input id="s-name" placeholder="Script Title" />
    </div>
    
    <div class="form-row">
      <label>Exposure</label>
      <select><option>Public</option><option>Unlisted</option></select>
    </div>
  </div>

  <button class="btn-submit" id="submit-btn" onclick="generatePaste()">Create Paste</button>
</div>

<!-- Success Modal -->
<div class="success-modal" id="success-modal">
  <div class="success-content">
    <div class="success-header">
      <span class="badge">PUBLIC</span>
      <span class="success-title">Paste ready — share this link:</span>
    </div>
    
    <div class="link-box">
      <input type="text" id="out-link" readonly />
      <button class="btn-copy" onclick="copyVal('out-link')">Copy link</button>
    </div>

    <div class="loadstring-box">
      <code id="out-loader-text">loadstring(...)</code>
      <button class="btn-copy" onclick="copyVal('out-loader-text')">Copy</button>
    </div>

    <button class="btn-submit" style="margin-top: 2rem; background: #333; color: #fff;" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = '/';
  document.getElementById('user-name').textContent = localStorage.getItem('username');

  // Editor stats
  const editor = document.getElementById('s-code');
  editor.addEventListener('input', () => {
    const text = editor.value;
    document.getElementById('line-count').textContent = text.split('\n').length + ' lines';
    document.getElementById('char-count').textContent = (new Blob([text]).size / 1024).toFixed(1) + ' KB';
  });

  async function generatePaste() {
    const btn = document.getElementById('submit-btn');
    const name = document.getElementById('s-name').value.trim();
    const content = editor.value.trim();

    if (!name || !content) return alert('Title and code required');

    btn.disabled = true; btn.textContent = 'Uploading...';

    try {
      const res = await fetch('/api/paste', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, content })
      });
      
      const textData = await res.text();
      let data;
      try { data = JSON.parse(textData); } catch(e) { throw new Error(textData || 'Invalid JSON'); }
      
      if (!res.ok) throw new Error(data.error || 'Server error');

      if (data.slug) {
        const fullUrl = `${location.origin}/api/loader/${data.slug}`;
        document.getElementById('out-link').value = fullUrl;
        document.getElementById('out-loader-text').textContent = `loadstring(game:HttpGet("${fullUrl}"))()`;
        document.getElementById('success-modal').classList.add('active');
      } else {
        throw new Error('No slug returned');
      }
    } catch(e) {
      alert('Error: ' + e.message);
    }

    btn.disabled = false; btn.textContent = 'Create Paste';
  }

  function copyVal(id) {
    const el = document.getElementById(id);
    const text = el.value || el.textContent;
    navigator.clipboard.writeText(text);
    alert('Copied to clipboard!');
  }

  function closeModal() {
    document.getElementById('success-modal').classList.remove('active');
    editor.value = '';
    document.getElementById('s-name').value = '';
    document.getElementById('line-count').textContent = '0 lines';
    document.getElementById('char-count').textContent = '0 KB';
  }

  function logout() { localStorage.clear(); window.location.href = '/'; }
</script>
</body>
</html>
