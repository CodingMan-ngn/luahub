<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — LuaHub</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css?v=10"/>
  <script src="/assets/app.js?v=10" defer></script>
  <style>
    /* AuroraX Dark Theme UI */
    body { background: #0a0a0c; color: #e2e2e8; font-family: 'Inter', sans-serif; }
    .dash-container { display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 250px; background: #111115; border-right: 1px solid #222; padding: 1.5rem; display: flex; flex-direction: column; }
    .sidebar h1 { font-size: 1.2rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem; }
    .sidebar a { color: #888; text-decoration: none; padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 0.5rem; font-weight: 500; transition: 0.2s; display: block; }
    .sidebar a.active, .sidebar a:hover { background: rgba(124,58,237,0.1); color: #a78bfa; }
    
    .main-content { flex: 1; padding: 3rem; overflow-y: auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .header h2 { font-size: 2rem; font-weight: 800; }
    .profile { display: flex; align-items: center; gap: 0.75rem; font-weight: 600; }
    .profile img { width: 32px; height: 32px; border-radius: 50%; }

    /* Upload Form */
    .panel { background: #15151a; border: 1px solid #222; border-radius: 12px; padding: 2rem; margin-bottom: 2rem; }
    .panel h3 { margin-bottom: 1.5rem; font-size: 1.2rem; color: #fff; }
    .input-group { margin-bottom: 1.5rem; }
    .input-group label { display: block; margin-bottom: 0.5rem; color: #888; font-size: 0.9rem; }
    input[type="text"], textarea { width: 100%; background: #0a0a0c; border: 1px solid #333; color: #fff; padding: 1rem; border-radius: 8px; font-family: inherit; transition: 0.3s; }
    input:focus, textarea:focus { border-color: #7c3aed; outline: none; }
    textarea { min-height: 150px; font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
    
    .toggles { display: flex; gap: 2rem; margin-bottom: 1.5rem; }
    .toggle-label { display: flex; align-items: center; gap: 0.5rem; color: #ccc; cursor: pointer; }
    .toggle-label input { accent-color: #7c3aed; width: 18px; height: 18px; }
    
    .btn { background: #7c3aed; color: #fff; border: none; padding: 1rem 2rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #6d28d9; }

    /* Output Result */
    .result-box { background: #0a0a0c; border: 1px solid #333; border-radius: 8px; padding: 1.5rem; margin-top: 1rem; display: none; }
    .result-box code { display: block; background: #000; padding: 1rem; border-radius: 6px; font-family: 'JetBrains Mono', monospace; color: #10b981; font-size: 0.85rem; overflow-x: auto; white-space: pre-wrap; word-break: break-all; margin-top: 0.5rem; cursor: pointer; }
    .result-box p { color: #888; font-size: 0.9rem; margin-top: 1rem; }
    .result-box .key-input { color: #f59e0b; font-weight: bold; }
  </style>
</head>
<body>
  <div class="dash-container">
    <div class="sidebar">
      <h1><svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.8l6.9 13.8H5.1L12 5.8z"/></svg> LuaHub</h1>
      <a href="/">Home</a>
      <a href="#" class="active">Dashboard</a>
      <a href="/scripts">Browse Scripts</a>
      <a href="#" onclick="localStorage.clear(); location.href='/';">Logout</a>
    </div>
    
    <div class="main-content">
      <div class="header">
        <h2>Script Dashboard</h2>
        <div class="profile">
          <img id="user-avatar" src="" alt="User">
          <span id="user-name">Loading...</span>
        </div>
      </div>

      <div class="panel">
        <h3>Deploy New Script</h3>
        <div class="input-group">
          <label>Script Name</label>
          <input type="text" id="s-name" placeholder="e.g., Universal ESP" />
        </div>
        <div class="input-group">
          <label>Paste the Base64 Encrypted Payload (.bin)</label>
          <textarea id="s-code" placeholder="Paste your obfuscator.py output here..."></textarea>
        </div>
        
        <div class="toggles">
          <label class="toggle-label">
            <input type="checkbox" id="t-public" checked> Public Source
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="t-key"> Require Key (Luarmor Style)
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="t-updating"> Mark as Updating
          </label>
        </div>

        <button class="btn" id="upload-btn" onclick="uploadScript()">Deploy Script</button>
        <div id="upload-result" class="result-box"></div>
      </div>
    </div>
  </div>

  <script>
    window.addEventListener('load', async () => {
      const session = await checkSession();
      if (!session.loggedIn) return window.location.href = '/';
      document.getElementById('user-avatar').src = session.avatar;
      document.getElementById('user-name').textContent = session.name;
    });

    async function uploadScript() {
      const btn = document.getElementById('upload-btn');
      const name = document.getElementById('s-name').value;
      const content = document.getElementById('s-code').value;
      const isPublic = document.getElementById('t-public').checked;
      const reqKey = document.getElementById('t-key').checked;
      const isUpdating = document.getElementById('t-updating').checked;

      if (!name || !content) return alert('Name and payload required');

      btn.textContent = 'Deploying...'; btn.disabled = true;

      try {
        const res = await apiFetch('/api/scripts', 'POST', {
          name, content, is_public: isPublic, requires_key: reqKey, is_updating: isUpdating
        });

        const box = document.getElementById('upload-result');
        box.style.display = 'block';

        if (res.slug) {
          const url = `${window.location.origin}/api/loader/${res.slug}`;
          
          // Build the exact Luarmor template
          let loaderCode = '';
          if (reqKey) {
            loaderCode = `script_key = "KEY";\nloadstring(game:HttpGet("${url}"))()`;
          } else {
            loaderCode = `loadstring(game:HttpGet("${url}"))()`;
          }

          box.innerHTML = `
            <p style="color:#10b981; font-weight:bold;">✅ Script Deployed Successfully</p>
            <p>Copy this to your executor:</p>
            <code onclick="navigator.clipboard.writeText('${loaderCode.replace(/'/g, "\\'")}'); alert('Copied!')">${loaderCode}</code>
            <p><span style="color:#f59e0b;">Note:</span> If the script requires a key, instruct users to paste <code>script_key = "KEY";</code> above the loadstring.</p>
          `;
          
          document.getElementById('s-name').value = '';
          document.getElementById('s-code').value = '';
        } else {
          box.innerHTML = `<p style="color:#ef4444;">Error: ${res.error}</p>`;
        }
      } catch (e) { alert(e.message); }
      
      btn.textContent = 'Deploy Script'; btn.disabled = false;
    }
  </script>
</body>
</html>
