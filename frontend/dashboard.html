<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard — LuaHub</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=45"/>
<style>
  .admin-layout { display: flex; min-height: calc(100vh - 75px); max-width: 1400px; margin: 0 auto; }
  .sidebar { width: 260px; border-right: 1px solid var(--glass-border); padding: 2rem 1rem; }
  .main-content { flex: 1; padding: 2rem 3rem; }
  
  .tab-btn {
    display: flex; align-items: center; gap: 1rem; width: 100%;
    padding: 1rem 1.5rem; background: transparent; border: none;
    color: var(--muted); font-size: 1rem; font-weight: 600;
    text-align: left; cursor: pointer; border-radius: 8px; transition: 0.2s;
    margin-bottom: 0.5rem;
  }
  .tab-btn:hover { background: var(--surface); color: #fff; }
  .tab-btn.active { background: rgba(124,58,237,0.15); color: var(--accent-soft); border-left: 3px solid var(--accent); }
  .tab-btn svg { width: 20px; height: 20px; }

  .tab-content { display: none; animation: fadeIn 0.3s ease; }
  .tab-content.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  
  .form-group { margin-bottom: 1.5rem; }
  .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600; color: #fff; }
  
  .script-item { padding: 1rem; background: rgba(0,0,0,0.3); border-radius: 8px; margin-bottom: 0.8rem; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
  .script-item:hover { border-color: var(--accent); background: rgba(124,58,237,0.1); }
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">
    <svg class="logo-icon" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.8l6.9 13.8H5.1L12 5.8z"/></svg>
    LuaHub Admin
  </a>
  <div class="nav-links">
    <a href="/">Back to Site</a>
    <span id="user-name" style="color:#fff; font-weight:600;"></span>
    <button onclick="logout()" style="background:none;border:none;color:#ef4444;cursor:pointer;font-weight:600;">Logout</button>
  </div>
</nav>

<div class="admin-layout">
  <div class="sidebar">
    <button class="tab-btn active" onclick="switchTab('editor', this)">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
      Script Editor
    </button>
    <button class="tab-btn" onclick="switchTab('public', this)">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      Public Scripts
    </button>
    <button class="tab-btn" onclick="switchTab('settings', this)">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      Settings
    </button>
  </div>

  <div class="main-content">
    <div id="tab-editor" class="tab-content active">
      <div class="panel">
        <h2 style="margin-bottom: 1.5rem;">Create New Script</h2>
        
        <div class="form-group">
          <label>Script Name</label>
          <input id="s-name" placeholder="e.g. Quantum Onyx"/>
        </div>

        <div class="form-group">
          <label>Raw Lua Source</label>
          <textarea id="s-code" placeholder="Paste your raw Lua script here..." style="height:150px;"></textarea>
        </div>

        <div class="form-group" style="background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 8px;">
          <label style="display:flex; align-items:center; gap:10px; margin:0;">
            <input type="checkbox" id="t-key" style="width:20px; height:20px; margin-bottom: 0;"/> Enable Key System
          </label>
        </div>

        <button class="action" id="save-btn" onclick="saveScript()" style="margin-top: 1rem;">Deploy Script</button>
      </div>

      <div class="panel" style="margin-top: 2rem;">
        <h2 style="margin-bottom: 1.5rem;">Your Scripts</h2>
        <div id="my-scripts-list">
          <p class="text-muted">Loading scripts...</p>
        </div>
      </div>
    </div>

    <div id="tab-public" class="tab-content">
      <div class="panel">
        <h2 style="margin-bottom: 1.5rem;">Public Scripts</h2>
        <div class="script-grid" id="public-scripts-grid">
          <p class="text-muted">Loading scripts...</p>
        </div>
      </div>
    </div>

    <div id="tab-settings" class="tab-content">
      <div class="panel">
        <h2 style="margin-bottom: 1.5rem;">Account Settings</h2>
        <div class="form-group">
          <label>Username</label>
          <input id="set-username" readonly style="opacity: 0.7;"/>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  const token = localStorage.getItem('token');
  if (!token) window.location.href = '/';
  
  const username = localStorage.getItem('username');
  document.getElementById('user-name').textContent = username;
  document.getElementById('set-username').value = username;

  let allScripts = [];

  function switchTab(tabId, btnEl) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(`tab-${tabId}`).classList.add('active');
    btnEl.classList.add('active');
  }

  async function loadScripts() {
    const res = await fetch('/api/scripts');
    allScripts = await res.json();
    
    const devList = document.getElementById('my-scripts-list');
    const myScripts = allScripts.filter(s => s.users && s.users.username === username);
    
    if (myScripts.length === 0) {
      devList.innerHTML = '<p class="text-muted">No scripts deployed yet.</p>';
    } else {
      devList.innerHTML = myScripts.map(s => `
        <div class="script-item">
          <div style="font-weight: 600;">${s.name}</div>
          <div style="font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem;">
            ${s.requires_key ? 'Key System' : 'Free'} · ${s.hits || 0} runs
          </div>
        </div>
      `).join('');
    }

    const publicGrid = document.getElementById('public-scripts-grid');
    if (allScripts.length === 0) {
      publicGrid.innerHTML = '<p class="text-muted">No public scripts available.</p>';
    } else {
      publicGrid.innerHTML = allScripts.map(s => `
        <div class="script-card">
          <div class="script-header">
            <div class="script-title">${s.name}</div>
            <div class="script-author">${s.users ? s.users.username : 'Anonymous'}</div>
          </div>
          <div class="script-meta">
            <span>${s.obf_method.toUpperCase()}</span>
            <span>${s.hits || 0} runs</span>
          </div>
        </div>
      `).join('');
    }
  }

  async function saveScript() {
    const btn = document.getElementById('save-btn');
    const name = document.getElementById('s-name').value.trim();
    const content = document.getElementById('s-code').value.trim();
    const requires_key = document.getElementById('t-key').checked;

    if (!name || !content) return alert('Name and content required');

    btn.disabled = true; btn.textContent = 'Processing...';

    const res = await fetch('/api/scripts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ name, content, requires_key, obf_method: 'integrated' })
    });
    
    const data = await res.json();
    if (data.slug) {
      alert('Script deployed successfully.');
      document.getElementById('s-name').value = '';
      document.getElementById('s-code').value = '';
      document.getElementById('t-key').checked = false;
      loadScripts();
    } else {
      alert('Error: ' + data.error);
    }
    
    btn.disabled = false; btn.textContent = 'Deploy Script';
  }

  function logout() { localStorage.clear(); window.location.href = '/'; }

  loadScripts();
</script>
</body>
</html>
