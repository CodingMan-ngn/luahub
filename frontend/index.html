<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LuaHub — Premium Script Hub</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css?v=5"/>
</head>
<body>
  <nav>
    <a href="/" class="logo">
      <svg width="24" height="24" fill="currentColor" class="logo-icon" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.8l6.9 13.8H5.1L12 5.8z"/></svg> 
      LuaHub
    </a>
    <div class="nav-links">
      <a href="#scripts">Scripts</a>
      <a href="#keysystem">Key System</a>
      <a href="/dashboard" id="nav-dash" style="display:none; color:var(--accent); font-weight:700;">Dashboard</a>
      <button id="login-btn" onclick="loginDiscord()" style="background:none; border:1px solid var(--accent); color:var(--accent); padding: 0.5rem 1rem; border-radius:8px; font-weight:600; cursor:pointer; transition:0.3s;">Login</button>
    </div>
  </nav>

  <!-- Hero / Stats -->
  <section class="hero">
    <h1>Welcome to LuaHub.<br/><span>The fastest script hub.</span></h1>
    <p>Secure, obfuscated, and lightning fast script delivery.</p>
    
    <div class="stats-bar">
      <div class="stat-item"><h3 id="stat-scripts">0</h3><p>Scripts</p></div>
      <div class="stat-item"><h3 id="stat-hits">0</h3><p>Executions</p></div>
      <div class="stat-item"><h3>100%</h3><p>Uptime</p></div>
    </div>
  </section>

  <!-- Search & Grid -->
  <section id="scripts" style="padding-top: 2rem;">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search scripts..." onkeyup="filterScripts()">
    </div>
    <div class="script-grid" id="script-grid">
      <p style="color: var(--muted); text-align: center; grid-column: 1/-1;">Loading scripts...</p>
    </div>
  </section>

  <!-- Key System Info -->
  <section id="keysystem" style="margin-bottom: 4rem;">
    <div class="feat-card" style="max-width: 800px; margin: 0 auto; text-align: center;">
      <h2 style="font-size: 2rem; margin-bottom: 1rem;">🔑 Get your Key</h2>
      <p style="color: var(--muted); margin-bottom: 2rem;">You need a valid key to execute premium scripts. Generate yours below.</p>
      <button class="btn-primary" onclick="getKey()" style="width: 100%;">Generate Key (Linkvertise)</button>
      <div id="key-display" class="hidden" style="margin-top: 1.5rem; background: rgba(0,0,0,0.5); padding: 1rem; border-radius: 8px;">
        <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 0.5rem;">Your Key:</p>
        <code id="key-text" style="font-size: 1.2rem; color: #10b981; font-weight: bold; letter-spacing: 2px;"></code>
      </div>
    </div>
  </section>

  <script src="/assets/app.js?v=5"></script>
</body>
</html>
