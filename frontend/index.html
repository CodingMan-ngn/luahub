<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LuaHub — Premium Scripts</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=20"/>
<style>
  .source-viewer {
    background: #000; border: 1px solid var(--glass-border); border-radius: 8px;
    padding: 1rem; font-family: var(--mono); font-size: 0.8rem; color: #cbd5e1;
    white-space: pre-wrap; max-height: 200px; overflow-y: auto; margin-top: 1rem;
  }
  /* New member display */
  .members-bar {
    display: flex; justify-content: center; align-items: center; gap: 1.5rem;
    background: var(--surface); padding: 1rem 2rem; border-radius: 20px;
    border: 1px solid var(--glass-border); backdrop-filter: blur(16px);
    max-width: 650px; margin: 1.5rem auto 0; flex-wrap: wrap;
  }
  .member-item { display: flex; align-items: center; gap: 0.5rem; }
  .member-avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--glass-border); }
  .member-name { font-size: 0.85rem; font-weight: 500; color: var(--muted); }
  .member-dev { color: var(--accent-soft); font-weight: 700; font-size: 0.7rem; background: rgba(124,58,237,0.2); padding: 2px 6px; border-radius: 4px; margin-left: 4px;}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">
    <svg width="24" height="24" fill="currentColor" class="logo-icon" viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 3.8l6.9 13.8H5.1L12 5.8z"/></svg> LuaHub
  </a>
  <div class="nav-links">
    <a href="#scripts">Scripts</a>
    <a href="/dashboard" id="nav-dash" style="display:none; color:var(--accent); font-weight:700;">Dashboard</a>
    <button id="login-btn" class="btn-primary" style="padding: 0.5rem 1rem; font-size:0.9rem;" onclick="loginDiscord()">Login with Discord</button>
    <div id="user-info" style="display:none; align-items:center; gap:10px;">
      <img id="user-avatar" src="" style="width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);" />
      <span id="user-name" style="font-weight:600;color:#fff;"></span>
      <button onclick="logout()" style="background:none;border:none;color:#ef4444;cursor:pointer;font-weight:600;font-family:inherit;">Logout</button>
    </div>
  </div>
</nav>

<section class="hero">
  <h1>The #1 Script Hub.<br/><span>Secure & Fast.</span></h1>
  <p>Access premium, obfuscated Roblox scripts. Join the community today.</p>
  <div class="hero-btns">
    <button class="btn-primary" onclick="loginDiscord()" id="hero-login-btn">Get Started with Discord</button>
    <a href="https://discord.gg/yourinvite" target="_blank" class="btn-secondary">Join Discord</a>
  </div>
  
  <div class="stats-bar">
    <div class="stat-item"><h3 id="stat-scripts">0</h3><p>Scripts</p></div>
    <div class="stat-item"><h3 id="stat-hits">0</h3><p>Executions</p></div>
    <div class="stat-item"><h3>99.9%</h3><p>Uptime</p></div>
  </div>
  
  <!-- NEW MEMBERS BAR -->
  <div class="members-bar" id="members-bar" style="display:none;">
    <span style="font-size:0.8rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-right:1rem;">Latest Users</span>
    <div id="members-list" style="display:flex; gap:1rem; flex-wrap:wrap; justify-content:center;"></div>
  </div>
</section>

<div class="ticker-wrap">
  <div class="ticker" id="ticker">
    <div class="ticker-item">Loading live scripts...</div>
  </div>
</div>

<section id="scripts">
  <h2 style="font-size: 2rem; margin-bottom: 2rem;">Public Scripts</h2>
  <div class="script-grid" id="script-grid">
    <p style="color:var(--muted); text-align:center; grid-column: 1/-1;">Loading scripts...</p>
  </div>
</section>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  if (token) {
    localStorage.setItem('token', token);
    window.history.replaceState({}, document.title, "/");
  }

  function loginDiscord() {
    const clientId = "YOUR_DISCORD_CLIENT_ID";
    const redirectUri = encodeURIComponent(window.location.origin + '/api/auth');
    window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=code&scope=identify`;
  }

  function logout() {
    localStorage.clear();
    window.location.href = '/';
  }

  async function init() {
    const userToken = localStorage.getItem('token');
    
    if (userToken) {
      try {
        const payload = JSON.parse(atob(userToken.split('.')[1]));
        document.getElementById('login-btn').style.display = 'none';
        document.getElementById('hero-login-btn').style.display = 'none';
        document.getElementById('nav-dash').style.display = 'inline-block';
        document.getElementById('user-info').style.display = 'flex';
        document.getElementById('user-name').textContent = payload.name;
      } catch(e) {}
    }

    // Fetch Scripts
    const grid = document.getElementById('script-grid');
    try {
      const res = await fetch('/api/scripts');
      const allScripts = await res.json();
      
      document.getElementById('stat-scripts').textContent = allScripts.length;
      let totalHits = allScripts.reduce((sum, s) => sum + (s.hits || 0), 0);
      document.getElementById('stat-hits').textContent = totalHits;

      if (!allScripts.length) { 
        grid.innerHTML = '<p style="color:var(--muted); grid-column:1/-1; text-align:center;">No scripts available yet.</p>'; 
        return; 
      }
      
      renderGrid(allScripts);
      renderTicker(allScripts);
    } catch (e) {
      grid.innerHTML = '<p style="color:#ef4444; grid-column:1/-1; text-align:center;">No scripts found.</p>';
    }

    // Fetch Latest Members
    try {
      const memRes = await fetch('/api/members');
      const members = await memRes.json();
      if (members.length > 0) {
        document.getElementById('members-bar').style.display = 'flex';
        document.getElementById('members-list').innerHTML = members.map(m => `
          <div class="member-item" title="${m.discord_name}">
            <img src="${m.discord_avatar}" class="member-avatar" alt="${m.discord_name}">
            ${m.is_dev ? '<span class="member-dev">DEV</span>' : ''}
          </div>
        `).join('');
      }
    } catch(e) {}
  }

  function renderTicker(scripts) {
    const ticker = document.getElementById('ticker');
    const itemsHtml = scripts.map(s => `<div class="ticker-item"><span>${s.owner_name}</span> loaded ${s.name}</div>`).join('');
    ticker.innerHTML = itemsHtml + itemsHtml + itemsHtml;
  }

  function renderGrid(scripts) {
    const grid = document.getElementById('script-grid');
    grid.innerHTML = scripts.map(s => `
      <div class="script-card">
        <div class="script-header">
          <div class="script-title">${s.name}</div>
          <div class="script-author">by ${s.owner_name}</div>
        </div>
        <div class="script-meta">
          <span>👁 ${s.hits || 0} Runs</span>
          ${s.requires_key ? '<span style="color:#ef4444;">🔑 Key Req</span>' : ''}
        </div>
        ${s.is_public_source ? `
          <div style="margin-bottom: 1rem;">
            <button class="btn-secondary" style="width:100%; padding:0.5rem; font-size:0.8rem;" onclick="toggleSource('${s.id}')">View Source</button>
            <div class="source-viewer hidden" id="src-${s.id}">${s.source_code || 'No source provided.'}</div>
          </div>
        ` : ''}
        <button class="btn-primary" style="width:100%; margin-top:auto; padding: 0.6rem;" onclick="copyLoader('${s.slug}')">
          Copy Loadstring
        </button>
      </div>
    `).join('');
  }

  function toggleSource(id) {
    const el = document.getElementById(`src-${id}`);
    el.classList.toggle('hidden');
  }

  function copyLoader(slug) {
    if (!localStorage.getItem('token')) return loginDiscord();
    const loader = `loadstring(game:HttpGet("${window.location.origin}/api/loader/${slug}"))()`;
    navigator.clipboard.writeText(loader);
    alert('Loader copied to clipboard!');
  }

  init();
</script>
</body>
</html>
