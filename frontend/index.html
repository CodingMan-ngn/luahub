<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LuaHub — Script Hosting</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=15"/>
<script src="/assets/app.js?v=15" defer></script>
</head>
<body>
<nav>
  <a href="/" class="logo" style="display:inline-flex;align-items:center;gap:0.5rem;">
    <img src="/favicon.svg" alt="" width="22" height="22" style="border-radius:5px;"/>
    LuaHub
  </a>
  <div class="nav-links">
    <a href="/dashboard.html">Dashboard</a>
    <span id="user-name" style="color:#e2e8f0;font-weight:600"></span>
    <button onclick="logout()" style="background:none;border:none;color:#ef4444;cursor:pointer;font-weight:600">Logout</button>
  </div>
</nav>

<section style="padding:4rem 2rem;max-width:1200px;margin:0 auto;">
  <h1 style="font-size:3rem;font-weight:800;margin-bottom:0.5rem;">LuaHub</h1>
  <p style="color:#94a3b8;margin-bottom:2.5rem;">Host, obfuscate, and deploy Roblox scripts. Loader URLs, key systems, role-gated distribution.</p>

  <div id="auth-section" style="max-width:400px;">
    <h2 style="margin-bottom:1rem;">Sign In</h2>
    <input id="a-email" placeholder="Email" style="width:100%;margin-bottom:1rem"/>
    <input id="a-pass" type="password" placeholder="Password" style="width:100%;margin-bottom:1rem"/>
    <button class="action" onclick="login()" style="width:100%;margin-bottom:1rem;">Login</button>
    <button class="action" onclick="register()" style="width:100%;background:#334155;">Register</button>
    <div id="auth-result" style="margin-top:1rem;"></div>
  </div>

  <h2 style="margin-top:4rem;margin-bottom:1.5rem;">Public Scripts</h2>
  <div id="scripts-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;">
    <p style="color:#94a3b8;">Loading...</p>
  </div>
</section>

<script>
  async function login() {
    const email = document.getElementById('a-email').value.trim();
    const password = document.getElementById('a-pass').value;
    const r = await fetch('/api/auth', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'login', email, password })
    });
    const d = await r.json();
    if (d.token) {
      localStorage.setItem('token', d.token);
      localStorage.setItem('username', d.username);
      localStorage.setItem('role', d.role || 'user');
      localStorage.setItem('verified', d.verified ? 'true' : 'false');
      location.href = '/dashboard.html';
    } else {
      document.getElementById('auth-result').innerHTML = `<span style="color:#ef4444">${d.error || 'Login failed'}</span>`;
    }
  }

  async function register() {
    const email = document.getElementById('a-email').value.trim();
    const password = document.getElementById('a-pass').value;
    const username = email.split('@')[0] + Math.floor(Math.random()*1000);
    const r = await fetch('/api/auth', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'register', username, email, password })
    });
    const d = await r.json();
    if (d.token) {
      localStorage.setItem('token', d.token);
      localStorage.setItem('username', d.username);
      localStorage.setItem('role', d.role || 'user');
      localStorage.setItem('verified', d.verified ? 'true' : 'false');
      location.href = '/dashboard.html';
    } else {
      document.getElementById('auth-result').innerHTML = `<span style="color:#ef4444">${d.error || 'Register failed'}</span>`;
    }
  }

  function logout() {
    localStorage.clear();
    location.href = '/';
  }

  document.getElementById('user-name').textContent = localStorage.getItem('username') || '';
  if (localStorage.getItem('token')) {
    document.getElementById('auth-section').style.display = 'none';
  }

  fetch('/api/scripts').then(r => r.json()).then(list => {
    const grid = document.getElementById('scripts-grid');
    if (!Array.isArray(list) || !list.length) {
      grid.innerHTML = '<p style="color:#94a3b8">No public scripts yet.</p>';
      return;
    }
    grid.innerHTML = list.map(s => `
      <div class="panel" style="padding:1.25rem;">
        <strong style="display:block;font-size:1.05rem;">${s.name}</strong>
        <div style="font-size:0.75rem;color:#a78bfa;margin:0.35rem 0;">${s.obf_method}</div>
        <div style="font-size:0.8rem;color:#94a3b8;">${s.hits || 0} runs${s.requires_key ? ' · key required' : ''}</div>
        <code style="display:block;margin-top:0.6rem;font-size:0.7rem;color:#94a3b8;">${s.slug}</code>
      </div>`).join('');
  }).catch(() => {});
</script>
</body>
</html>
