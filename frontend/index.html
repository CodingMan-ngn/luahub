<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LuaHub — Premium Scripts</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #030303; --primary: #7c3aed; --primary-glow: rgba(124, 58, 237, 0.4);
    --text: #fff; --text-muted: #888;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }
  
  /* 3D Background Glow */
  .bg-glow {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
    background: radial-gradient(circle at 50% -20%, var(--primary-glow) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Nav */
  nav { padding: 1.5rem 4rem; display: flex; justify-content: space-between; align-items: center; position: absolute; top: 0; width: 100%; z-index: 100; }
  .logo { font-size: 1.2rem; font-weight: 900; display: flex; align-items: center; gap: 0.5rem; }
  .nav-links a { color: var(--text-muted); text-decoration: none; margin-left: 2rem; font-weight: 600; transition: 0.3s; }
  .nav-links a:hover { color: #fff; text-shadow: 0 0 10px var(--primary); }
  .btn-nav { background: var(--primary); color: #fff; padding: 0.6rem 1.2rem; border-radius: 8px; text-decoration: none; font-weight: 700; transition: 0.3s; }
  .btn-nav:hover { transform: translateY(-2px); box-shadow: 0 0 20px var(--primary-glow); }

  /* Hero Section */
  .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 2rem; }
  .hero h1 { font-size: 5rem; font-weight: 900; line-height: 1.1; letter-spacing: -2px; animation: fadeUp 1s ease forwards; }
  .hero h1 span { background: linear-gradient(to right, #a78bfa, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hero p { color: var(--text-muted); font-size: 1.2rem; margin: 1.5rem 0 3rem 0; max-width: 600px; animation: fadeUp 1s ease 0.2s forwards; opacity: 0; }
  .btn-hero { background: var(--primary); color: #fff; padding: 1rem 2.5rem; border-radius: 50px; text-decoration: none; font-weight: 800; font-size: 1.1rem; transition: 0.3s; animation: fadeUp 1s ease 0.4s forwards; opacity: 0; display: inline-block; }
  .btn-hero:hover { transform: scale(1.05); box-shadow: 0 0 30px var(--primary-glow); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

  /* 3D Script Slider */
  .scripts-section { padding: 5rem 2rem; max-width: 1200px; margin: 0 auto; perspective: 1000px; }
  .section-title { font-size: 2.5rem; font-weight: 800; margin-bottom: 3rem; text-align: center; }
  .slider { display: flex; gap: 2rem; overflow-x: auto; padding: 2rem 0; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .slider::-webkit-scrollbar { display: none; }
  
  .script-card { min-width: 320px; scroll-snap-align: center; background: rgba(20, 20, 20, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 2rem; transform-style: preserve-3d; transition: transform 0.4s ease, box-shadow 0.4s ease; }
  .script-card:hover { transform: translateY(-10px) rotateX(5deg) rotateY(-5deg); box-shadow: -20px 20px 40px rgba(0,0,0,0.8), 0 0 20px rgba(124,58,237,0.2); border-color: rgba(124,58,237,0.5); }
  .script-card h3 { font-size: 1.5rem; margin-bottom: 0.5rem; }
  .script-card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 2rem; }
  .btn-copy { background: rgba(124,58,237,0.1); border: 1px solid var(--primary); color: var(--primary); width: 100%; padding: 0.8rem; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; }
  .btn-copy:hover { background: var(--primary); color: #fff; }
</style>
</head>
<body>

<div class="bg-glow"></div>

<nav>
  <div class="logo">LuaHub</div>
  <div class="nav-links">
    <a href="/dashboard">Dashboard</a>
    <a href="/keys">Key System</a>
    <a href="https://discord.gg/P4P5jZGt3m" target="_blank">Discord</a>
  </div>
</nav>

<div class="hero">
  <h1>The Next Generation<br/>of <span>Script Execution.</span></h1>
  <p>Secure, fast, and obfuscated. Access the premier repository for Roblox scripts with zero compromises on performance or safety.</p>
  <a href="/dashboard" class="btn-hero">Explore the Hub</a>
</div>

<div class="scripts-section">
  <h2 class="section-title">Featured Scripts</h2>
  <div class="slider" id="public-feed">
    <!-- Cards loaded via JS -->
  </div>
</div>

<script>
  // Fetch scripts for the slider
  fetch('/api/scripts').then(res => res.json()).then(scripts => {
    const feed = document.getElementById('public-feed');
    if (!scripts.length) return;
    
    feed.innerHTML = scripts.slice(0, 5).map(s => `
      <div class="script-card">
        <h3>${s.name}</h3>
        <p>${s.description || 'No description provided.'}</p>
        <button class="btn-copy" onclick="navigator.clipboard.writeText('loadstring(game:HttpGet(\\'https://lua-axon.vercel.app/api/loader?placeId=\\' .. game.PlaceId .. \\'&hwid=\\' .. game:GetService(\\'RbxAnalyticsService\\'):GetClientId()))()'); alert('Loadstring Copied!')">Copy Loadstring</button>
      </div>
    `).join('');
  });
</script>
</body>
</html>
