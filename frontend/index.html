<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LuaHub — Premium Scripts</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=21"/>
<style>
  /* Cinematic overrides */
  body { display: flex; flex-direction: column; min-height: 100vh; }
  .cinematic-intro {
    flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 2rem; z-index: 10; position: relative;
  }
  .cinematic-intro h1 {
    font-size: clamp(3.5rem, 8vw, 6rem); font-weight: 900; line-height: 1.05; letter-spacing: -0.05em;
    margin-bottom: 1.5rem;
    background: linear-gradient(180deg, #fff 30%, rgba(255,255,255,0.4) 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 0 60px rgba(124,58,237,0.3);
    animation: fadeUp 1s ease-out;
  }
  .cinematic-intro p {
    color: var(--muted); font-size: 1.2rem; max-width: 580px; line-height: 1.6;
    margin-bottom: 3rem; animation: fadeUp 1.2s ease-out;
  }
  .btn-hero {
    padding: 1.1rem 3rem; border-radius: 12px; font-weight: 700; font-size: 1.1rem;
    background: var(--accent); color: #fff; border: none; cursor: pointer;
    box-shadow: 0 0 40px rgba(124,58,237,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    animation: fadeUp 1.4s ease-out;
  }
  .btn-hero:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 0 60px rgba(124,58,237,0.6), inset 0 1px 0 rgba(255,255,255,0.4);
    background: #8b5cf6;
  }
  @keyframes fadeUp {
    0% { opacity: 0; transform: translateY(30px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  /* Floating glow orbs */
  .orb {
    position: absolute; border-radius: 50%; filter: blur(100px); z-index: 0; pointer-events: none;
  }
  .orb-1 { width: 400px; height: 400px; background: rgba(124,58,237,0.15); top: -10%; left: 10%; animation: float 10s infinite alternate; }
  .orb-2 { width: 300px; height: 300px; background: rgba(16,185,129,0.1); bottom: 10%; right: 10%; animation: float 8s infinite alternate-reverse; }
  @keyframes float {
    0% { transform: translate(0, 0); }
    100% { transform: translate(40px, -40px); }
  }
  nav { background: transparent !important; border-bottom: none !important; justify-content: center !important; padding: 2rem !important; }
</style>
</head>
<body>
  <div class="orb orb-1"></div>

  <nav>

    <button class="btn-hero" onclick="loginDiscord()">Get Started</button>
  </div>

<script>
  function loginDiscord() {
    // REPLACE WITH YOUR REAL 18-DIGIT DISCORD CLIENT ID
    const clientId = "123456789012345678"; 
    const redirectUri = encodeURIComponent(window.location.origin + '/api/auth');
    window.location.href = `https://discord.com/api/oauth2/authorize?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=code&scope=identify`;
  }
</script>
</body>
</html>
