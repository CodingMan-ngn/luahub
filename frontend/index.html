<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LuaHub — Script Hosting</title>
  <link rel="stylesheet" href="/assets/style.css"/>
</head>
<body>

  <!-- LOADER OVERLAY -->
  <div id="preloader">
    <div class="loader-logo">LuaHub</div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>

  <nav>
    <a href="/" class="logo">
      <svg class="logo-icon" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 22h20L12 2zm0 3.8l6.9 13.8H5.1L12 5.8z"/></svg>
      <div class="logo-text">Lua<span>Hub</span></div>
    </a>
    <div class="nav-links">
      <a href="/scripts.html">Browse</a>
      <a href="#" id="nav-login">Login</a>
      <a href="/dashboard.html" id="nav-dash" style="display:none">Dashboard</a>
      <a href="#" id="nav-logout" style="display:none">Logout</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Host your Roblox scripts.<br/><span>Free. Fast. Obfuscated.</span></h1>
    <p>Upload scripts, get a loader URL, share with anyone — no cost ever.</p>
    <div class="hero-btns">
      <a href="/dashboard.html" class="btn-primary">🚀 Get Started</a>
      <a href="/scripts.html" class="btn-secondary">Browse Scripts</a>
    </div>
  </section>

  <script src="/assets/app.js"></script>
  <script>
    // Preloader Logic
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('preloader').classList.add('done');
      }, 1200); // Shows the loading bar for 1.2s
    });
  </script>
</body>
</html>
