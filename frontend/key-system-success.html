<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Claim Key — LuaHub</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { background: #0f111a; color: #fff; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .container { background: #1a1d2d; padding: 3rem; border-radius: 16px; text-align: center; max-width: 500px; width: 100%; border: 1px solid #2d3348; }
  .key-box { font-family: monospace; font-size: 1.5rem; color: #10b981; background: #000; padding: 1.5rem; border-radius: 8px; border: 1px dashed #10b981; margin: 2rem 0; word-break: break-all; }
  .btn { display: block; width: 100%; padding: 1rem; background: #7c3aed; color: #fff; text-decoration: none; font-weight: 800; border-radius: 8px; border: none; cursor: pointer; font-size: 1rem; }
</style>
</head>
<body>
<div class="container">
  <h1 id="statusTitle">Verifying...</h1>
  <p id="statusText" style="color: #94a3b8;">Please wait while we verify your session.</p>
  <div class="key-box" id="keyDisplay" style="display: none;"></div>
  <button class="btn" id="copyBtn" style="display: none;" onclick="copyKey()">Copy Key</button>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');
  const slug = urlParams.get('slug'); // Assuming Linkvertise returns this, or you can bake it into the token
  let finalKey = '';

  async function verifyClaim() {
    if (!token) {
      document.getElementById('statusTitle').textContent = 'Error';
      document.getElementById('statusText').textContent = 'No token provided.';
      return;
    }

    try {
      // Note: If Linkvertise doesn't pass the slug back, you need to store it with the token in the DB.
      const res = await fetch('/api/keys', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'claim', token, slug: slug || 'your-script-slug' })
      });
      const data = await res.json();

      if (data.key) {
        finalKey = data.key;
        document.getElementById('statusTitle').textContent = 'Success!';
        document.getElementById('statusText').textContent = 'Here is your key:';
        document.getElementById('keyDisplay').textContent = finalKey;
        document.getElementById('keyDisplay').style.display = 'block';
        document.getElementById('copyBtn').style.display = 'block';
      } else {
        document.getElementById('statusTitle').textContent = 'Failed';
        document.getElementById('statusText').textContent = data.error || 'Verification failed.';
      }
    } catch (e) {
      document.getElementById('statusTitle').textContent = 'Error';
      document.getElementById('statusText').textContent = 'Network error.';
    }
  }

  function copyKey() {
    navigator.clipboard.writeText(finalKey);
    alert('Copied!');
  }

  verifyClaim();
</script>
</body>
</html>
