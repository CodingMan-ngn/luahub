<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Key System — LuaHub</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { background: #0f111a; color: #fff; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .container { background: #1a1d2d; padding: 3rem; border-radius: 16px; text-align: center; max-width: 500px; width: 100%; border: 1px solid #2d3348; }
  .btn { display: block; width: 100%; padding: 1rem; background: #10b981; color: #000; text-decoration: none; font-weight: 800; border-radius: 8px; margin-top: 1rem; border: none; cursor: pointer; font-size: 1rem; }
  .btn:hover { background: #059669; }
</style>
</head>
<body>
<div class="container">
  <h1>Get Key</h1>
  <p style="color: #94a3b8;">Click the button below to start the verification process.</p>
  <button class="btn" id="startBtn" onclick="startProcess()">Start Verification</button>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const slug = urlParams.get('slug') || 'default-script';

  async function startProcess() {
    const btn = document.getElementById('startBtn');
    btn.disabled = true;
    btn.textContent = 'Generating Session...';

    try {
      // 1. Get the unique token
      const res = await fetch('/api/keys', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'start', slug })
      });
      const data = await res.json();

      if (data.token) {
        // 2. Fetch the script's Linkvertise URL from the database
        const scriptRes = await fetch('/api/scripts');
        const scripts = await scriptRes.json();
        const script = scripts.find(s => s.slug === slug);
        
        if (script && script.boosty_url) {
          // Append the token to the URL so Linkvertise passes it back
          const redirectUrl = `${script.boosty_url}?token=${data.token}`;
          window.location.href = redirectUrl;
        } else {
          alert('BoostyLink URL not configured for this script.');
          btn.disabled = false;
          btn.textContent = 'Start Verification';
        }
      }
    } catch (e) {
      alert('Network error.');
      btn.disabled = false;
      btn.textContent = 'Start Verification';
    }
  }
</script>
</body>
</html>
